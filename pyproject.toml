[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-ai"
version = "0.1.0"
description = "GeoNexus SatQuery AI backend nucleus for evidence-grounded remote sensing queries."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "numpy>=2.0,<3.0",
  "rasterio>=1.4,<2.0",
  "pillow>=11.0,<12.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.7,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0"
]
full-geo = [
  "geopandas>=1.0,<2.0",
  "scikit-image>=0.25,<1.0",
  "opencv-python-headless>=4.10,<5.0"
]
vqa = [
  "torch>=2.4",
  "transformers>=4.45,<5.0",
  "accelerate>=1.0,<2.0"
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
